# 只放一个 job：race 检测。
#
# 为什么单开一个 job：`-race` 需要 cgo（C 工具链），本机（Windows 纯 Go
# 环境）没有 gcc，跑不了；ubuntu-latest 自带 gcc。仓库其余部分没有 CI，
# 先把「能自动跑的」这一件做起来。
#
# 覆盖范围：Linux 上可跑的是纯 Go 包（engine / core / runtime / browser 的
# 非 Windows 标签部分）。backend/sdl2 与 browser 的窗口类测试是
# `//go:build windows`，只能在 Windows 上跑（且需要真实窗口）——那部分靠
# 本地 `go test ./...` 与人工复核。
name: race

on:
  push:
    branches: [master]
  pull_request:

jobs:
  race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        # 注意：Linux 上只 vet 得到 Linux 可编译的文件——backend/sdl2 与
        # browser 的 Windows 标签文件不在内（那些是 //go:build windows）。
        # 这里的 vet 是「纯 Go 部分的静态检查」，不是 sdl2 包过了 vet。
        run: go vet ./...
      - name: go test -race
        run: go test -race ./... -count=1
